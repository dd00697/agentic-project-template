# pre-commit is the single source of truth for checks. Git hooks, agent hooks and CI all run it:
#   pre-commit run --all-files                       # format, lint, typecheck, secret scan
#   pre-commit run --all-files --hook-stage manual   # tests (also run automatically on git push)
# Setup once per clone: pre-commit install          Update pinned versions: pre-commit autoupdate

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit] # hooks without `stages` run on commit only; tests opt into push/manual

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
        exclude: (^|/)(tsconfig[^/]*|jsconfig[^/]*|\.vscode/[^/]*)\.json$ # JSONC
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: detect-private-key
      # Enforces branch-per-ticket. For quick personal projects, delete this hook and
      # drop it from SKIP= in .github/workflows/ci.yml.
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: sync-skills
        name: sync .agents/skills -> .claude/skills
        language: python
        entry: python scripts/sync_skills.py
        pass_filenames: false
        files: ^(\.agents/skills/|\.claude/skills/|scripts/sync_skills\.py$)

