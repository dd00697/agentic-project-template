name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # ==== PYTHON (uncomment to enable) ====
      # - uses: astral-sh/setup-uv@v7
      # - run: uv sync --frozen

      # ==== TYPESCRIPT (uncomment to enable) ====
      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: 24
      #     cache: npm
      # - run: npm ci

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit==4.7.0

      - name: Format, lint, typecheck, skills sync
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          # gitleaks runs in the `secrets` job: its hook scans staged changes only.
          SKIP: no-commit-to-branch,gitleaks

      - name: Tests
        run: pre-commit run --all-files --hook-stage manual

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the last commit

      # The gitleaks binary directly (no licence needed, unlike gitleaks-action for org repos).
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum --check -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan for secrets
        run: gitleaks git --redact --verbose
