name: Bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages and logs, with secrets and personal data removed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version / commit, OS, browser, etc.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] The steps above no longer reproduce the bug
        - [ ] A regression test covers it
    validations:
      required: true
